
modLoader="javafml" 
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}" #mandatory
version="${mod_version}"
displayName="${mod_name}" 
credits="Japan Umamusume Training Center Academy (aka Tracen Academy)" 
authors="${mod_authors}" 
description='''
(On your marks  Get set…  Go!)
Ooooooooooh  (horsey-buds!) Oooooooh  (horsey-hop! horsey-hop!)
Horsey horsey meowsy meowsy  3 2 1  Fight!!
'''
[[mixins]]
config="mixins.umapyoi.json"
[[accessTransformers]]
## The file is relative to the output directory of the resources, or the root path inside the jar when compiled
## The 'resources' directory represents the root output directory of the resources
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge" 
    type="required"
    # The version range of the dependency
    versionRange="${neo_version_range}" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT or SERVER
    side="BOTH"
# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mysterious_mountain_lib"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.2.14-1.21.1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.0.5+1.21,)"
    ordering="AFTER"
    side="BOTH"