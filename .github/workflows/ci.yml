on:
  push:
    branches:
      - "1.21"
    tags:
      - "*"
  pull_request:
    branches:
      - "1.21"


name: Mod Compilation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set-up Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          java-package: jdk

      - name: Kill Gradle Daemon
        run: bash ./gradlew --stop

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-1.21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-1.21-

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bash ./gradlew build

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: bash ./gradlew publishMod
        env:
          CURSE_TOKEN: ${{ secrets.CURSE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: build/libs/*.jar