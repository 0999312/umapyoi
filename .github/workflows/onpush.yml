on:
  push:
    branches:
      - 1.20.1
  pull_request:
    branches:
      - 1.20.1

name: Artifact Upload

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: build/reobfJar/*.jar